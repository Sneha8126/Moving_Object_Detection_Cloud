<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Moving Object Detection | YOLOv11 Neon Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===================== LOADING OVERLAY ===================== -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loader-ring"></div>
    <p class="loader-text">INITIALIZING NEURAL CORE...</p>
  </div>

  <!-- ===================== NOTIFICATION CONTAINER ===================== -->
  <div id="notification-container" class="notification-container"></div>

  <!-- ===================== TOP NAVIGATION BAR ===================== -->
  <header class="navbar">
    <div class="navbar-left">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" class="logo-icon">
          <path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="title-block">
        <h1 class="project-title">MOVING OBJECT <span>DETECTION</span></h1>
        <p class="project-subtitle">Powered by YOLOv11 Neural Engine</p>
      </div>
    </div>

    <div class="navbar-right">
      <div class="datetime-block">
        <span id="live-date" class="live-date">--</span>
        <span id="live-time" class="live-time">--:--:--</span>
      </div>
      <div class="status-dot-wrapper">
        <span id="system-status-dot" class="status-dot offline"></span>
        <span id="system-status-text">SYSTEM IDLE</span>
      </div>
    </div>
  </header>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="main-layout">

    <!-- ---------- CENTER: LIVE FEED ---------- -->
    <section class="feed-panel glass-card">
      <div class="feed-header">
        <h2><span class="pulse-dot"></span> Live Camera Feed</h2>
        <span class="feed-badge">LIVE WEBCAM AI STREAM</span>
      </div>

      <div class="video-wrapper">
        <img id="video-feed" class="video-feed" src="" alt="Live feed will appear here">

        <!-- ===================== BROWSER WEBCAM CAPTURE (hidden) =====================
             These two elements are never shown. The <video> tag receives the live
             getUserMedia() webcam stream; the <canvas> is used purely to grab still
             frames from that stream and convert them to JPEG before sending them to
             the server for YOLOv11 detection. The annotated result the server sends
             back is what's actually displayed, in the #video-feed <img> above. -->
        <video id="webcam-video" autoplay playsinline muted style="display:none;"></video>
        <canvas id="capture-canvas" style="display:none;"></canvas>

        <div id="video-placeholder" class="video-placeholder">
          <svg viewBox="0 0 24 24" class="camera-icon">
            <path fill="currentColor" d="M4 5h3l2-2h6l2 2h3a1 1 0 011 1v13a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1zm8 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6z"/>
          </svg>
          <p>Camera feed is offline</p>
          <span>Click "Start Camera" and allow camera access to begin live detection</span>
        </div>
        <div class="scan-overlay"></div>
      </div>
    </section>

    <!-- ---------- RIGHT: SIDE PANEL ---------- -->
    <aside class="side-panel">

      <div class="stat-card glass-card">
        <div class="stat-icon-wrap detect-icon">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5a7 7 0 100 14 7 7 0 000-14zm0 2a5 5 0 110 10 5 5 0 010-10zm0 2a3 3 0 100 6 3 3 0 000-6z"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-label">Detection Status</span>
          <span id="stat-detection-status" class="stat-value status-pill idle">IDLE</span>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon-wrap record-icon">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-label">Recording Status</span>
          <span id="stat-recording-status" class="stat-value status-pill stopped">STOPPED</span>
        </div>
      </div>

    </aside>
  </main>

  <!-- ===================== BOTTOM CONTROL PANEL ===================== -->
  <footer class="control-panel glass-card">
    <button id="btn-start-camera" class="ctrl-btn btn-primary">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      Start Camera
    </button>

    <button id="btn-stop-camera" class="ctrl-btn btn-danger">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
      Stop Camera
    </button>

    <button id="btn-switch-camera" class="ctrl-btn btn-cyan" disabled>
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 13c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 004 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
      Switch Camera
    </button>

    <button id="btn-screenshot" class="ctrl-btn btn-cyan">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h3l2-2h6l2 2h3a1 1 0 011 1v13a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1zm8 3a5 5 0 100 10 5 5 0 000-10z"/></svg>
      Screenshot
    </button>

    <button id="btn-start-recording" class="ctrl-btn btn-purple">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
      Start Recording
    </button>

    <button id="btn-stop-recording" class="ctrl-btn btn-purple-outline">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
      Stop Recording
    </button>

    <button id="btn-download-screenshot" class="ctrl-btn btn-ghost">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 20h14v-2H5v2zm7-18v12.17l4.59-4.58L18 11l-6 6-6-6 1.41-1.41L12 14.17V2z"/></svg>
      Download Screenshot
    </button>

    <button id="btn-download-recording" class="ctrl-btn btn-ghost">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 20h14v-2H5v2zm7-18v12.17l4.59-4.58L18 11l-6 6-6-6 1.41-1.41L12 14.17V2z"/></svg>
      Download Recording
    </button>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
